target-version = "py312"
line-length = 100
src = [
    "apps/backend/src",
    "apps/frontend",
    "connectors",
    "rag",
    "mcp-servers/alarm-management/src",
    "services/alarm_api_simulator",
    "tests",
    "scripts",
]
extend-exclude = ["rag/documents", ".venv"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B008: FastAPI's Query()/Depends()/Header() etc. are designed to be used exactly this
# way -- they're evaluated fresh per request by FastAPI's DI system, not a mutable
# default in the Python-footgun sense this rule otherwise correctly flags.
ignore = ["B008"]

[lint.isort]
known-first-party = [
    "copilot",
    "frontend",
    "connectors",
    "rag",
    "mcp_servers",
    "alarm_api_simulator",
]

[format]
quote-style = "double"
indent-style = "space"
