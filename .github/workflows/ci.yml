name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check — strict core (domain, compliance, mcp, llm)
        run: |
          uv run mypy --strict \
            apps/backend/src/copilot/domain \
            apps/backend/src/copilot/compliance \
            apps/backend/src/copilot/mcp \
            apps/backend/src/copilot/llm

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  test:
    name: Unit / integration / e2e / RAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run test suite (stub LLM provider, no API keys)
        env:
          LLM_PROVIDER: stub
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  contract:
    name: Postman contract tests (newman)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provision alarmdb role and database
        run: |
          uv run python -c "
          from scripts.init_db import ProvisionSpec, provision_roles_and_databases
          spec = ProvisionSpec(
              copilot_db='copilot',
              copilot_user='copilot_rw',
              copilot_password='copilot-ci-pw',
              alarmdb='alarmdb',
              alarmapi_user='alarmapi_rw',
              alarmapi_password='alarmapi-ci-pw',
          )
          provision_roles_and_databases('postgresql://postgres:postgres@localhost:5432/postgres', spec)
          "

      - name: Start the simulator (compact profile, deterministic seed)
        env:
          ALARM_API_TOKEN: demo-token
          ALARMDB_HOST: localhost
          ALARMDB_PORT: "5432"
          ALARMDB_NAME: alarmdb
          ALARMDB_USER: alarmapi_rw
          ALARMDB_PASSWORD: alarmapi-ci-pw
          SIM_PROFILE: compact
          SIM_SEED: "20260812"
          SIM_NOW: "2026-08-13T00:00:00+00:00"
        run: |
          nohup uv run python -m alarm_api_simulator > simulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null && echo "simulator up after ${i}s" && exit 0
            sleep 1
          done
          echo "simulator failed to become healthy"; cat simulator.log; exit 1

      - name: Newman — baseline collection
        run: npx --yes newman run postman/Alarm-API-Simulator.postman_collection.json --env-var baseUrl=http://localhost:8000

      - name: Newman — chaining flows
        run: npx --yes newman run postman/chaining/Alarm-API-Chaining.postman_collection.json --env-var baseUrl=http://localhost:8000

      - name: Newman — scenarios
        run: npx --yes newman run postman/scenarios/Alarm-API-Scenarios.postman_collection.json --env-var baseUrl=http://localhost:8000

      - name: Upload simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-log
          path: simulator.log
          if-no-files-found: ignore
